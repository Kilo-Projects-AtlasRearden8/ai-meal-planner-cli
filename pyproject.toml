[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-planner"
version = "0.1.0"
description = "Local-first CLI that generates weekly meal plans from pantry ingredients using an OpenAI-compatible endpoint (default Ollama)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Asdale Dynamics, LLC"}]
keywords = ["meal-planning", "ollama", "local-ai", "cli", "groceries"]

[project.scripts]
meal-plan = "meal_planner.cli:main"

[tool.setuptools]
packages = ["meal_planner"]
